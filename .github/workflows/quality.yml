name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile install
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Web build
        run: npm run build
      - name: Mobile typecheck
        run: npm --prefix apps/mobile exec tsc -- --noEmit
      - name: Expo doctor
        run: cd apps/mobile && npx expo-doctor
